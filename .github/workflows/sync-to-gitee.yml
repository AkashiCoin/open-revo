name: Mirror to Gitee

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  sync-to-gitee:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push Mirror to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          echo "[*] Configuring Gitee remote..."
          git remote add gitee "https://faintonce:${GITEE_TOKEN}@gitee.com/faintonce/open-revo.git"
          
          echo "[*] Synchronizing main and master branches to Gitee..."
          git push -f gitee main:main
          git push -f gitee main:master
          
          echo "[*] Synchronizing release tags to Gitee..."
          git push -f gitee --tags
          
          echo "[OK] Gitee mirror synchronization completed successfully!"
